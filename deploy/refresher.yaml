# Keeps Headlamp's sign-ins fresh: signs in to each Supervisor and every VKS
# cluster it can see, stores the kubeconfig as a Secret, restarts Headlamp.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vks-fleet-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vks-fleet-refresher
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["headlamp"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vks-fleet-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vks-fleet-refresher
subjects:
  - kind: ServiceAccount
    name: vks-fleet-refresher
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vks-fleet-refresher
  labels:
    app.kubernetes.io/name: vks-fleet-refresher
    app.kubernetes.io/part-of: vks-fleet
spec:
  # Tokens from kubectl vsphere login last about 10 hours.
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vks-fleet-refresher
        spec:
          serviceAccountName: vks-fleet-refresher
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: refresh
              image: python
              command: ["python", "/app/refresh.py"]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: VSPHERE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: vks-fleet-vsphere
                      key: username
                - name: VSPHERE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: vks-fleet-vsphere
                      key: password
              envFrom:
                - configMapRef:
                    name: vks-fleet-refresher-env
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: script
              configMap:
                name: vks-fleet-refresher-script
            - name: work
              emptyDir: {}
