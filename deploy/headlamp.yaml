apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: vks-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
        app.kubernetes.io/part-of: vks-fleet
    spec:
      serviceAccountName: headlamp
      # Headlamp talks to Supervisors and VKS clusters through the kubeconfig
      # the refresher maintains, not through this cluster's API.
      automountServiceAccountToken: false
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp
          args:
            - -kubeconfig=/kube/config
            - -plugins-dir=/headlamp/plugins
          ports:
            - name: http
              containerPort: 4466
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: kubeconfig
              mountPath: /kube
              readOnly: true
            - name: plugin
              mountPath: /headlamp/plugins/vks-fleet
              readOnly: true
      volumes:
        # Written by the vks-fleet-refresher job. The pod waits until it exists.
        - name: kubeconfig
          secret:
            secretName: vks-fleet-kubeconfig
            defaultMode: 0444
        # The plugin (from the release ConfigMap) plus the preset settings, in one folder.
        - name: plugin
          projected:
            sources:
              - configMap:
                  name: vks-fleet-plugin
              - configMap:
                  name: vks-fleet-settings
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: vks-fleet
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - name: http
      port: 80
      targetPort: http
