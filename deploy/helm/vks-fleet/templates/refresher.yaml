{{- if .Values.refresher.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vks-fleet.name" . }}-refresher
  labels: {{- include "vks-fleet.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vks-fleet.name" . }}-refresher
  labels: {{- include "vks-fleet.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "vks-fleet.kubeconfig" . | quote }}]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "vks-fleet.headlamp" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vks-fleet.name" . }}-refresher
  labels: {{- include "vks-fleet.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vks-fleet.name" . }}-refresher
subjects:
  - kind: ServiceAccount
    name: {{ include "vks-fleet.name" . }}-refresher
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vks-fleet.name" . }}-refresher
  labels: {{- include "vks-fleet.labels" . | nindent 4 }}
data:
  refresh.py: |
{{ .Files.Get "files/refresh.py" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vks-fleet.name" . }}-refresher-env
  labels: {{- include "vks-fleet.labels" . | nindent 4 }}
data:
  SUPERVISORS: {{ required "refresher.supervisors is required (the Supervisor API addresses)" .Values.refresher.supervisors | quote }}
  CLUSTERS: {{ .Values.refresher.clusters | quote }}
  KUBECONFIG_SECRET: {{ include "vks-fleet.kubeconfig" . | quote }}
  HEADLAMP_DEPLOYMENT: {{ include "vks-fleet.headlamp" . | quote }}
  {{- range $k, $v := .Values.refresher.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "vks-fleet.name" . }}-refresher
  labels:
    {{- include "vks-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/name: vks-fleet-refresher
spec:
  # Tokens from kubectl vsphere login last about 10 hours.
  schedule: {{ .Values.refresher.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vks-fleet-refresher
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ include "vks-fleet.name" . }}-refresher
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: {{ .Values.refresher.image }}
              command: ["python", "/app/refresh.py"]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SUPERVISOR_INSECURE
                  value: {{ .Values.refresher.insecure | toString | quote }}
                {{- if .Values.caSecret }}
                - name: CA_FILE
                  value: /etc/vks-fleet-ca/ca.crt
                {{- end }}
                - name: VSPHERE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.refresher.credentialsSecret }}
                      key: username
                - name: VSPHERE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.refresher.credentialsSecret }}
                      key: password
              envFrom:
                - configMapRef:
                    name: {{ include "vks-fleet.name" . }}-refresher-env
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: work
                  mountPath: /work
                {{- if .Values.caSecret }}
                - name: ca
                  mountPath: /etc/vks-fleet-ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: script
              configMap:
                name: {{ include "vks-fleet.name" . }}-refresher
            - name: work
              emptyDir: {}
            {{- if .Values.caSecret }}
            - name: ca
              secret:
                secretName: {{ .Values.caSecret }}
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
