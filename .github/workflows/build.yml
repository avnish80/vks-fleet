# Builds the Headlamp plugin on GitHub's runners (which can reach npm) and
# publishes a ready-to-install tarball.
#
#   push to main  -> build + downloadable workflow artifact
#   push tag v*   -> build + GitHub release with vks-fleet.tar.gz attached
#   manual run    -> Actions tab -> build -> Run workflow
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Generates package.json/tsconfig matching the current Headlamp release,
      # in build/vks-fleet (ignored by git).
      - name: Scaffold Headlamp plugin project
        run: |
          mkdir -p build
          cd build
          npx --yes @kinvolk/headlamp-plugin@0.14 create vks-fleet

      - name: Add plugin source
        working-directory: build/vks-fleet
        run: |
          rm -rf src
          cp -r "$GITHUB_WORKSPACE/src" ./src
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            npm pkg set version="${GITHUB_REF_NAME#v}"
          fi
          npm install

      # Unit and end-to-end tests (Node's test runner via tsx). Blocking: a
      # failing test stops the release. Locally: npx tsx --test tests/*.test.ts
      - name: Test
        working-directory: build/vks-fleet
        run: |
          cp -r "$GITHUB_WORKSPACE/tests" ./tests
          npx --yes tsx@4 --test tests/*.test.ts
          # The vCenter collector (standard-library Python)
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/deploy/collector" -p 'test_*.py'

      # Type-check against the real Headlamp types. Blocking: a type error stops the release.
      - name: Type-check
        working-directory: build/vks-fleet
        run: npm run tsc

      - name: Build
        working-directory: build/vks-fleet
        run: npm run build

      - name: Package
        working-directory: build/vks-fleet
        run: |
          mkdir -p out/vks-fleet
          cp dist/main.js package.json out/vks-fleet/
          tar -czf "$GITHUB_WORKSPACE/vks-fleet.tar.gz" -C out vks-fleet
          tar -tzf "$GITHUB_WORKSPACE/vks-fleet.tar.gz"

      # The same plugin as a ConfigMap, for in-cluster deployments (deploy/).
      - name: Plugin ConfigMap
        working-directory: build/vks-fleet
        run: |
          kubectl create configmap vks-fleet-plugin \
            --from-file=main.js=dist/main.js --from-file=package.json=package.json \
            --dry-run=client -o yaml > "$GITHUB_WORKSPACE/vks-fleet-plugin-configmap.yaml"
          ls -l "$GITHUB_WORKSPACE/vks-fleet-plugin-configmap.yaml"

      # The Helm chart: its script copies must match the originals, and it must
      # lint and render (defaults, and download mode with the collector).
      - name: Helm chart
        run: |
          diff -q deploy/refresher/refresh.py deploy/helm/vks-fleet/files/refresh.py
          diff -q deploy/collector/collect.py deploy/helm/vks-fleet/files/collect.py
          helm lint deploy/helm/vks-fleet --set refresher.supervisors=10.0.0.2
          helm template t deploy/helm/vks-fleet --set refresher.supervisors=10.0.0.2 > /tmp/default.yaml
          helm template t deploy/helm/vks-fleet --set refresher.supervisors=10.0.0.2 \
            --set plugin.source=download --set collector.enabled=true --set collector.vcenter=vcenter.example.com \
            --set ingress.enabled=true --set ingress.host=fleet.example.com --set tls.caSecret=vks-fleet-ca > /tmp/full.yaml
          helm template t deploy/helm/vks-fleet --set refresher.supervisors=10.0.0.2 --set tls.insecure=true > /tmp/insecure.yaml
          python3 -c "import yaml; [print(f, sum(1 for d in yaml.safe_load_all(open(f)) if d), 'objects') for f in ('/tmp/default.yaml', '/tmp/full.yaml', '/tmp/insecure.yaml')]"
          # Every pod must meet "restricted" Pod Security, which VKS enforces by default.
          python3 scripts/check-restricted.py /tmp/default.yaml /tmp/full.yaml /tmp/insecure.yaml \
            deploy/headlamp.yaml deploy/refresher.yaml deploy/collector/collector.yaml
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            v="${GITHUB_REF_NAME#v}"
            helm package deploy/helm/vks-fleet --version "$v" --app-version "$v"
          fi

      # Artifact Hub package metadata for this release (checksum of the tarball).
      - name: Artifact Hub metadata
        if: github.ref_type == 'tag'
        run: scripts/artifacthub-pkg.sh "${GITHUB_REF_NAME#v}" vks-fleet.tar.gz > artifacthub-pkg.yml

      - uses: actions/upload-artifact@v4
        with:
          name: vks-fleet
          path: |
            vks-fleet.tar.gz
            vks-fleet-plugin-configmap.yaml

      - name: Create release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # The release page: what VKS fleet is, what this version changed (from CHANGELOG.md), install, validation.
          python3 scripts/release-notes.py "$v" > release-notes.md
          # A version marked "release candidate" in CHANGELOG.md is published as a pre-release.
          PRE=""
          grep -qE "^## ${v//./\\.}( |$).*release candidate" CHANGELOG.md && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" vks-fleet.tar.gz vks-fleet-plugin-configmap.yaml \
            "vks-fleet-$v.tgz" artifacthub-pkg.yml \
            --title "VKS fleet $GITHUB_REF_NAME" --notes-file release-notes.md $PRE
