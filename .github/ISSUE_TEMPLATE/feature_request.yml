name: Feature request
description: Something an operator needs that the plugin doesn't do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find out or do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: context
    attributes:
      label: Your environment
      description: Fleet size, VCF version, anything relevant.
